<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foodfolio App Store Screenshot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="artboard" class="artboard">
      <div class="decor decor--one" aria-hidden="true"></div>
      <div class="decor decor--two" aria-hidden="true"></div>
      <div class="decor decor--three" aria-hidden="true"></div>
      <div class="decor decor--four" aria-hidden="true"></div>

      <header class="copy">
        <div class="brand" aria-label="foodfolio">
          <span class="brand__mark" aria-hidden="true"></span>
          <span>foodfolio</span>
        </div>
        <p id="eyebrow" class="eyebrow"></p>
        <h1 id="title" class="title"></h1>
        <p id="body" class="body-copy"></p>
        <div id="source-menu" class="source-menu" aria-label="保存元"></div>
        <div id="chips" class="chips" aria-label="特徴"></div>
      </header>

      <section id="steps" class="steps" aria-label="操作手順"></section>
      <section id="visual" class="visual" aria-label="アプリ画面"></section>
    </main>

    <script type="module" src="./render.js"></script>
  </body>
</html>
