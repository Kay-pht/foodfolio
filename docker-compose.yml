name: foodfolio-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: foodfolio
      POSTGRES_USER: foodfolio
      POSTGRES_PASSWORD: foodfolio
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodfolio -d foodfolio"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - foodfolio_postgres:/var/lib/postgresql

volumes:
  foodfolio_postgres:
