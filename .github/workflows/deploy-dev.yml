name: Deploy dev

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  PROJECT_ID: foodfolio-af28aa
  REGION: asia-southeast1
  REPOSITORY: foodfolio
  API_SERVICE: foodfolio-dev-api
  WORKER_SERVICE: foodfolio-dev-worker

jobs:
  classify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve deployment SHA
        id: target
        env:
          DISPATCH_SHA: ${{ github.sha }}
          QUALITY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "sha=${DISPATCH_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "sha=${QUALITY_SHA}" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Authenticate to inspect deployed services
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud for deployment inspection
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve deployed Cloud Run SHA
        id: deployed
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          api_image="$(gcloud run services describe "${API_SERVICE}" \
            --region="${REGION}" --project="${PROJECT_ID}" \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)"
          worker_image="$(gcloud run services describe "${WORKER_SERVICE}" \
            --region="${REGION}" --project="${PROJECT_ID}" \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)"
          image_prefix="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/app:"

          deployed_sha=""
          if [[ "${api_image}" == "${worker_image}" && "${api_image}" == "${image_prefix}"* ]]; then
            candidate="${api_image#"${image_prefix}"}"
            if [[ "${candidate}" =~ ^[0-9a-f]{40}$ ]]; then
              deployed_sha="${candidate}"
            fi
          fi

          if [[ -z "${deployed_sha}" ]]; then
            echo "::warning::Could not resolve one matching deployed SHA; deployment will not be skipped."
          fi
          echo "sha=${deployed_sha}" >> "${GITHUB_OUTPUT}"

      - name: Classify changed files
        id: changes
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            node scripts/classify-deployment-range.mjs
          fi

  deploy:
    needs: classify
    if: needs.classify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ needs.classify.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Authenticate Docker
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Install dependencies
        run: npm ci
      - name: Verify manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: npm run verify
      - name: Apply database migrations
        shell: bash
        run: |
          DATABASE_DIRECT_URL="$(gcloud secrets versions access latest --secret=foodfolio-dev-database-direct-url --project="${PROJECT_ID}")"
          export DATABASE_DIRECT_URL
          npm run prisma:migrate:deploy
      - name: Build and push image
        shell: bash
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/app:${DEPLOY_SHA}"
          docker build --tag "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
      - name: Deploy Worker
        run: >-
          gcloud run deploy "${WORKER_SERVICE}" --image="${IMAGE}"
          --region="${REGION}" --project="${PROJECT_ID}" --quiet
      - name: Deploy API
        run: >-
          gcloud run deploy "${API_SERVICE}" --image="${IMAGE}"
          --region="${REGION}" --project="${PROJECT_ID}" --quiet
      - name: Verify revisions are ready
        shell: bash
        run: |
          test "$(gcloud run services describe "${WORKER_SERVICE}" --region="${REGION}" --project="${PROJECT_ID}" --format='value(status.conditions[0].status)')" = "True"
          test "$(gcloud run services describe "${API_SERVICE}" --region="${REGION}" --project="${PROJECT_ID}" --format='value(status.conditions[0].status)')" = "True"
