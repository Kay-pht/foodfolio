name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Swift format check
        working-directory: ios
        run: >-
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcrun swift-format lint --recursive --strict
          Foodfolio FoodfolioTests FoodfolioIntegrationTests FoodfolioUITests
      - name: Build
        working-directory: ios
        run: >-
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcodebuild -project Foodfolio.xcodeproj -scheme Foodfolio
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build test products
        working-directory: ios
        run: >-
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcodebuild -project Foodfolio.xcodeproj -scheme Foodfolio
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO
          clean build-for-testing
      - name: Unit, integration, and UI E2E tests
        working-directory: ios
        run: >-
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          xcodebuild -project Foodfolio.xcodeproj -scheme Foodfolio
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO
          -parallel-testing-enabled YES
          -parallel-testing-worker-count 2
          test-without-building
