name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base SHA used to classify changed files
        required: true
        type: string
      head_sha:
        description: Head SHA to verify
        required: true
        type: string
      pr_number:
        description: Pull request number when dispatched by Auto Fix
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.sha != inputs.head_sha && format('stale-dispatch-{0}', github.run_id) || github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Check direct main push policy
        id: main_push_policy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAIN_PUSH_BEFORE_SHA: ${{ github.event.before }}
          MAIN_PUSH_AFTER_SHA: ${{ github.sha }}
        run: node scripts/check-main-push-policy.mjs

      - name: Validate dispatched PR context
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_BASE_SHA: ${{ inputs.base_sha }}
          QUALITY_EVENT_SHA: ${{ github.sha }}
          QUALITY_HEAD_REF: ${{ github.ref_name }}
          QUALITY_HEAD_SHA: ${{ inputs.head_sha }}
          QUALITY_PR_NUMBER: ${{ inputs.pr_number }}
        run: node scripts/validate-quality-dispatch.mjs

      - name: Resolve checked-out tree
        id: tree
        shell: bash
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "${GITHUB_OUTPUT}"

      - name: Find reusable PR Quality proof
        id: proof
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_TREE_SHA: ${{ steps.tree.outputs.sha }}
        run: node scripts/find-reusable-quality-proof.mjs

      - name: Classify changed files
        id: changes
        if: steps.proof.outputs.reusable != 'true'
        env:
          QUALITY_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-quality-changes.mjs

      - name: Check whitespace and conflict markers
        id: whitespace
        if: steps.proof.outputs.reusable != 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            git show --check --format= "${HEAD_SHA}"
          else
            git diff --check "${BASE_SHA}" "${HEAD_SHA}" --
          fi

      - name: Lint GitHub Actions workflows
        id: actionlint
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.workflows == 'true'
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.12 \
            -color

      - uses: hashicorp/setup-terraform@v3
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.terraform == 'true'
        with:
          terraform_version: "~1.10.0"
          terraform_wrapper: false

      - name: Check Terraform formatting
        id: terraform_format
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.terraform == 'true'
        run: terraform fmt -check -recursive infra/terraform

      - uses: actions/setup-node@v7
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          (steps.changes.outputs.backend == 'true' ||
            steps.changes.outputs.docs == 'true')
        with:
          node-version: 24.18.0
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        run: npm ci

      - name: Check task consistency
        id: tasks
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          (steps.changes.outputs.backend == 'true' ||
            steps.changes.outputs.docs == 'true')
        run: npm run tasks:check

      - name: Check specification change gate
        id: spec_change
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.spec_required == 'true'
        env:
          SPEC_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SPEC_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-spec-change.mjs

      - name: Check specification contracts
        id: specs
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          (steps.changes.outputs.backend == 'true' ||
            steps.changes.outputs.docs == 'true')
        run: npm run check:specs

      - name: Run autonomous P0 guardrails
        id: autonomous_p0
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          (steps.changes.outputs.backend == 'true' ||
            steps.changes.outputs.docs == 'true')
        run: npm run verify:autonomous-p0

      - name: Check backend formatting
        id: format
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        run: npm run format:check

      - name: Run backend lint
        id: lint
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        run: npm run lint

      - name: Check Prisma formatting
        id: prisma_format
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          npm run prisma:format
          git diff --exit-code -- prisma/schema.prisma

      - name: Run architecture guardrails
        id: architecture
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        run: npm run check:architecture

      - name: Run documentation guardrails
        id: docs
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          (steps.changes.outputs.backend == 'true' ||
            steps.changes.outputs.docs == 'true')
        run: npm run check:docs

      - name: Check Markdown formatting
        id: markdown_format
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.docs == 'true'
        env:
          MARKDOWN_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MARKDOWN_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/format-changed-markdown.mjs --check

      - name: Run iOS lint and format check
        id: ios_lint
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.ios == 'true'
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            swift:6.3@sha256:4e0fc24f0f93a5cf9a91bfcf182534bbc0571d70d757389c04ff1f616c1c460f \
            bash scripts/lint-ios.sh

      - name: Generate Prisma client
        id: prisma_generate
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        run: npm run prisma:generate

      - name: Validate Prisma schema
        id: prisma_validate
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        run: npm run prisma:validate

      - name: Build backend
        id: build
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        run: npm run build

      - name: Run unit tests
        id: unit
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        run: npm run test:unit

      - name: Run integration tests
        id: integration
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        run: npm run test:integration

      - name: Run E2E tests
        id: e2e
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        run: npm run test:e2e

      - name: Record PR Quality proof
        if: >-
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
        env:
          QUALITY_TREE_SHA: ${{ steps.tree.outputs.sha }}
          QUALITY_BACKEND_REQUIRED: ${{ steps.changes.outputs.backend }}
          QUALITY_IOS_REQUIRED: ${{ steps.changes.outputs.ios }}
        shell: bash
        run: |
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg tree_sha "${QUALITY_TREE_SHA}" \
            --argjson backend_required "${QUALITY_BACKEND_REQUIRED}" \
            --argjson ios_required "${QUALITY_IOS_REQUIRED}" \
            '{
              repository: $repository,
              runId: $run_id,
              treeSha: $tree_sha,
              backendRequired: $backend_required,
              iosRequired: $ios_required
            }' \
            > "${RUNNER_TEMP}/quality-proof.json"

      - name: Upload PR Quality proof
        if: >-
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
        uses: actions/upload-artifact@v7
        with:
          name: quality-proof-${{ steps.tree.outputs.sha }}
          path: ${{ runner.temp }}/quality-proof.json
          retention-days: 30

      - name: Write Quality summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Quality summary"
            echo
            echo "Single-runner, fail-fast policy is preserved. Steps after the first failure may be skipped."
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Direct main push policy | ${{ steps.main_push_policy.outcome }} |"
            echo "| Whitespace | ${{ steps.whitespace.outcome }} |"
            echo "| Actionlint | ${{ steps.actionlint.outcome }} |"
            echo "| Tasks | ${{ steps.tasks.outcome }} |"
            echo "| Specification change gate | ${{ steps.spec_change.outcome }} |"
            echo "| Specification contracts | ${{ steps.specs.outcome }} |"
            echo "| Autonomous P0 | ${{ steps.autonomous_p0.outcome }} |"
            echo "| Format | ${{ steps.format.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Architecture | ${{ steps.architecture.outcome }} |"
            echo "| Docs | ${{ steps.docs.outcome }} |"
            echo "| iOS lint | ${{ steps.ios_lint.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Unit | ${{ steps.unit.outcome }} |"
            echo "| Integration | ${{ steps.integration.outcome }} |"
            echo "| E2E | ${{ steps.e2e.outcome }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
