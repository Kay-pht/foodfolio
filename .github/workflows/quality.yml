name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve checked-out tree
        id: tree
        shell: bash
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "${GITHUB_OUTPUT}"

      - name: Find reusable PR Quality proof
        id: proof
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_TREE_SHA: ${{ steps.tree.outputs.sha }}
        run: node scripts/find-reusable-quality-proof.mjs

      - name: Classify changed files
        id: changes
        if: steps.proof.outputs.reusable != 'true'
        env:
          QUALITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-quality-changes.mjs

      - uses: actions/setup-node@v7
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        with:
          node-version: 24.18.0
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        run: npm ci

      - name: Run backend Quality checks
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.backend == 'true'
        run: npm run verify

      - name: Run iOS lint and format check
        if: >-
          steps.proof.outputs.reusable != 'true' &&
          steps.changes.outputs.ios == 'true'
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            swift:6.3@sha256:4e0fc24f0f93a5cf9a91bfcf182534bbc0571d70d757389c04ff1f616c1c460f \
            bash scripts/lint-ios.sh

      - name: Record PR Quality proof
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          QUALITY_TREE_SHA: ${{ steps.tree.outputs.sha }}
          QUALITY_BACKEND_REQUIRED: ${{ steps.changes.outputs.backend }}
          QUALITY_IOS_REQUIRED: ${{ steps.changes.outputs.ios }}
        shell: bash
        run: |
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg tree_sha "${QUALITY_TREE_SHA}" \
            --argjson backend_required "${QUALITY_BACKEND_REQUIRED}" \
            --argjson ios_required "${QUALITY_IOS_REQUIRED}" \
            '{
              repository: $repository,
              runId: $run_id,
              treeSha: $tree_sha,
              backendRequired: $backend_required,
              iosRequired: $ios_required
            }' \
            > "${RUNNER_TEMP}/quality-proof.json"

      - name: Upload PR Quality proof
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: quality-proof-${{ steps.tree.outputs.sha }}
          path: ${{ runner.temp }}/quality-proof.json
          retention-days: 30
