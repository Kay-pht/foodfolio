name: Format Consent Once

on:
  push:
    branches:
      - codex/ai-consent-before-login

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/ai-consent-before-login
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Format consent files
        run: npx --yes prettier@3.6.2 --write hosting/public/privacy/index.html src/api/ai-consent-routes.ts
      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hosting/public/privacy/index.html src/api/ai-consent-routes.ts
          git commit -m "chore: format AI consent files"
          git push origin HEAD:codex/ai-consent-before-login
