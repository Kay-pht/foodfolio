name: npm ci diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/npm-ci-diagnostic.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode:
          - foreground
          - deny-cpu-features
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          package-manager-cache: false

      - name: Record environment
        shell: bash
        run: |
          node --version
          npm --version
          df -h .

      - name: Measure npm ci
        shell: bash
        env:
          DIAGNOSTIC_MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          case "${DIAGNOSTIC_MODE}" in
            foreground)
              /usr/bin/time -v npm ci --foreground-scripts --timing --loglevel=http
              ;;
            deny-cpu-features)
              npm pkg set 'allowScripts.cpu-features=false' --json
              /usr/bin/time -v npm ci --timing --loglevel=http
              npm run verify
              ;;
            *)
              echo "Unknown diagnostic mode: ${DIAGNOSTIC_MODE}" >&2
              exit 1
              ;;
          esac

      - name: Upload npm timing data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-ci-timing-${{ matrix.mode }}
          path: ~/.npm/_logs/*-timing.json
          if-no-files-found: warn
          retention-days: 3
